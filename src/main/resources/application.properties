spring.application.name=screenmatch
# Se a variável DB_HOST não existir (rodando local), assume 'localhost'
# Se rodar dentro do Docker completo, o Spring receberá 'db' ou 'postgres' como host
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Configurações recomendadas para Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# log
logging.level.root=INFO
logging.level.com.screenmatch=DEBUG
logging.file.name=logs/app.log